; NOTE: values must use plain ASCII quotes or none at all. This file
; previously read `upload_max_filesize = “30M”` with typographic quotes, which
; PHP rejects ("no valid leading digits, interpreting as 0"), so the intended
; 30M limit never applied.
upload_max_filesize = 30M

; post_max_size caps the whole request, so it must exceed upload_max_filesize
; for a multi-photo listing to submit. The default of 8M would otherwise be the
; real ceiling regardless of the value above.
post_max_size = 120M
max_file_uploads = 20

; PHP otherwise runs in UTC here while the server clock and MySQL (time_zone
; SYSTEM) are Eastern, so every date() PHP wrote was four hours ahead of the
; timestamps MySQL fills in. Nothing PHP formats is stored in a DB column —
; posted_at, created_at and added_at all default to CURRENT_TIMESTAMP — so this
; only changes what PHP prints and writes to files. The .htaccess backups in
; includes/htaccess_allowlist.php stay named in UTC (gmdate) on purpose.
date.timezone = "America/New_York"
